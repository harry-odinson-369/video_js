name: video_js
description: "A video player package based on video.js package that work at javascript/html side."
version: 0.0.3
homepage: https://github.com/harry-odinson-369/video_js

environment:
  sdk: ^3.7.0
  flutter: ">=1.17.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_hls_parser: ^2.0.1
  http: ^1.3.0
  mime: ^2.0.0
  shelf: ^1.4.2
  shelf_router: ^1.1.4
  shelf_web_socket: ^3.0.0
  web_socket_channel: ^3.0.3
  webview_flutter: ^4.11.0
  webview_flutter_android: ^4.4.2
  webview_flutter_wkwebview: ^3.20.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:

  assets:
    - assets/
    - assets/packages/
